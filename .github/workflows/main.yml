name: main
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: make
