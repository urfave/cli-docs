name: main
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make

  # Dummy job to trick the stale branch protection rule
  test120_check_bypass:
    name: test (ubuntu-latest, 1.20.x)
    runs-on: ubuntu-latest
    steps:
      - name: Satisfy ghost check
        run: echo "Bypassing stale branch protection"
